<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    #inp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    input {
        width: 200px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .car {
        margin: 30px auto;
        padding: 20px;
        box-sizing: border-box;

        background-color: white;
        box-shadow: 0 3px 8px rgba(0, 0, 0, .25);
        border-radius: 10px;
        text-align: center;
        width: 300px;
        min-height: 200px;
        position: relative;
    }

    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, .5);
        display: none;
        justify-content: center;
        align-items: center;
    }

    #lukk {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 4px 9px;
    }

    .car {
        font-family: Arial, sans-serif;
        color: #333;
    }

    .car h2 {
        color: #2a6fdb;
        margin-top: 10px;
        border-bottom: 2px solid #2a6fdb;
        padding-bottom: 8px;
    }

    .car p {
        margin: 6px 0;
    }

    .car b {
        color: #555;
    }

    .tekst {
        margin-top: 15px;
        padding: 10px;
        background-color: #f2f6fc;
        border-radius: 5px;
        font-style: italic;
    }
    </style>
</head>
<body>
    <div id="inp">
        <input type="text" placeholder="Navn" class="name">
        <input type="text"placeholder="Alder" class="age">
        <input type="text" placeholder="class" class="cls">
        <label></label><input type="checkbox" class="elevcheckbox" >Er du elev?</label>
        <button id="btn">Opprett elev</button>
    </div>

    <div class="modal">
        <div class="car">
            <button id="lukk">X</button>
            <div class="info"></div>
        </div>
    </div>


<script src="index.js"></script>
    
</body>
</html>
